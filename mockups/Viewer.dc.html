<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Output viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1E1B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 56px 10px 10px; display: flex; align-items: center; gap: 4px">
<a href="Session.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600">Home redesign</span>
<span style="font-size: 12px; color: #6B6860">v3 of 3 · this session</span>
</div>
<div role="tablist" aria-label="View" style="margin-left: auto; margin-right: 4px; display: flex; padding: 3px; border-radius: 12px; background: #EAE6DD">
<button role="tab" aria-selected="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: #FFFFFF; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500">Preview</button>
<button role="tab" aria-selected="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #6B6860; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500">Code</button>
</div>
</header>

<main role="img" aria-label="Live render of home-redesign.html (placeholder)" style="flex: 1; margin: 0 12px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E3DED4; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 290px; background: #D9C9B8; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 22px">
<span style="height: 14px; width: 58%; border-radius: 7px; background: #F7F5F0"></span>
<span style="height: 10px; width: 36%; border-radius: 5px; background: #EFE7DD"></span>
<span style="margin-top: 6px; width: 112px; height: 38px; border-radius: 19px; background: #1F1E1B"></span>
</div>
<div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
<span style="height: 11px; width: 42%; border-radius: 6px; background: #E3DED4"></span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<span style="height: 140px; border-radius: 12px; background: #EFEBE3"></span>
<span style="height: 140px; border-radius: 12px; background: #EFEBE3"></span>
<span style="height: 140px; border-radius: 12px; background: #EFEBE3"></span>
</div>
</div>
</main>

<div role="tablist" aria-label="Versions" style="padding: 14px 16px 0; display: flex; align-items: center; gap: 6px">
<button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: #EAE6DD; color: #6B6860; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600">v1 · Nov 4</button>
<button role="tab" aria-selected="false" style="height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: #EAE6DD; color: #6B6860; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600">v2 · Nov 7</button>
<button role="tab" aria-selected="true" style="height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: #1F1E1B; color: #F7F5F0; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600">v3 · now</button>
<button style="margin-left: auto; height: 32px; padding: 0 4px; border: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; text-decoration: underline">Compare</button>
</div>
<footer style="padding: 12px 12px 30px">
<div style="background: #FFFFFF; border: 1px solid #E3DED4; border-radius: 26px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px rgba(31,30,27,0.05)">
<label for="fb" style="position: absolute; left: -9999px">Ask Claude Code to change this</label>
<input id="fb" placeholder="Ask Claude Code to change this" style="flex: 1; min-width: 0; height: 36px; border: 0; padding: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 16px">
<button aria-label="Send" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #1F1E1B; color: #F7F5F0; display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
