<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1E1B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #CFCAC0; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
<a href="Main.dc.html" aria-label="Close folder picker" style="height: 70px; flex: none"></a>

<section aria-label="Choose folder" style="flex: 1; background: #F7F5F0; border-radius: 28px 28px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 14px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D6D1C6"></span>

<div style="display: flex; align-items: center; gap: 4px; padding: 0 4px">
<button style="height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #6B6860; font-family: Inter, sans-serif; font-size: 14px">~</button>
<span aria-hidden="true" style="color: #A39F96">/</span>
<button style="height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #6B6860; font-family: Inter, sans-serif; font-size: 14px">workspace</button>
<span aria-hidden="true" style="color: #A39F96">/</span>
<span style="height: 32px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; font-weight: 600">{{crumb}}</span>
</div>

<div style="height: 42px; border-radius: 21px; background: #EFEBE3; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #6B6860; font-size: 15px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search folders</div>

<h2 style="margin: 6px 4px 0; font-size: 13px; font-weight: 600; color: #6B6860">Recent</h2>
<div role="radiogroup" aria-label="Folders" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="5">
<button role="radio" aria-checked="{{f.checked}}" onClick="{{f.pick}}" style="{{f.row}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">{{f.name}}</span>
<span style="font-size: 13px; color: #6B6860">{{f.meta}}</span>
</span>
<svg style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39F96" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>

<button style="display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 12px; border: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 16px; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 8v8M8 12h8"></path><rect x="3" y="3" width="18" height="18" rx="4"></rect></svg>New folder in workspace</button>

<a href="Main.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 27px; background: #1F1E1B; color: #F7F5F0; font-size: 16px; font-weight: 500; text-decoration: none">Use {{crumb}}</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { folder: 'binge' };
  }
  renderVals() {
    const folders = [
      { name: 'binge', meta: 'Swift · main · 2 sessions' },
      { name: 'podcast-app', meta: 'Swift · ui-redo · 1 session' },
      { name: 'feed-app', meta: 'Swift · main' },
      { name: 'tesla-fsd', meta: 'Python · main' },
      { name: 'agent-hub', meta: 'Swift + TS · main' }
    ];
    return {
      crumb: this.state.folder,
      folders: folders.map((f) => {
        const on = f.name === this.state.folder;
        return {
          ...f,
          checked: on ? 'true' : 'false',
          row: 'display:flex;align-items:center;gap:14px;min-height:58px;padding:0 12px;border:0;border-radius:16px;font-family:Inter,sans-serif;text-align:left;color:#1F1E1B;' + (on ? 'background:#EAE6DD;' : 'background:transparent;'),
          pick: () => this.setState({ folder: f.name })
        };
      })
    };
  }
}
</script>
</body>
</html>
