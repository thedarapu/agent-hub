<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1E1B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 56px 10px 0; display: flex; align-items: center">
<a href="Drawer.dc.html" aria-label="Open sessions" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"></path></svg>
</a>
<a href="NewSession.dc.html" style="margin: 0 auto; text-decoration: none; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 16px; font-weight: 500">
<span style="width: 9px; height: 9px; border-radius: 5px; background: {{agentColor}}"></span>Claude Code
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6860" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</a>
<button aria-label="New session" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1F1E1B; display: flex; align-items: center; justify-content: center">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
</button>
</header>

<main style="flex: 1; padding: 0 28px; display: flex; flex-direction: column; justify-content: center; gap: 28px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 34px; font-weight: 400; line-height: 1.2; letter-spacing: -0.4px">What are we building in binge today?</h1>
<div style="display: flex; flex-direction: column; gap: 4px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0; border: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 15px; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6860" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Continue last session</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0; border: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 15px; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6860" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M6 8.5v4a5 5 0 0 0 5 5h4.5"></path></svg>Review uncommitted changes</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0; border: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 15px; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6860" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 9-14 9z"></path></svg>Build and run in Simulator</button>
</div>
</main>

<footer style="padding: 0 12px 30px">
<div style="background: #FFFFFF; border: 1px solid #E3DED4; border-radius: 26px; padding: 14px 14px 10px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 10px rgba(31,30,27,0.05)">
<label for="msg" style="position: absolute; left: -9999px">Message Claude Code</label>
<input id="msg" placeholder="Message Claude Code" style="height: 30px; border: 0; padding: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 16px">
<div style="display: flex; align-items: center; gap: 8px">
<button aria-label="Attach" style="width: 36px; height: 36px; border: 1px solid #E3DED4; border-radius: 18px; background: transparent; color: #1F1E1B; display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<a href="Folders.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E3DED4; border-radius: 18px; text-decoration: none; display: flex; align-items: center; gap: 6px; font-size: 14px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>binge
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6860" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<button aria-label="Dictate" style="margin-left: auto; width: 36px; height: 36px; border: 0; border-radius: 18px; background: #1F1E1B; color: #F7F5F0; display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agentColor":{"editor":"color","default":"#C96442","options":["#C96442","#2F6FDB","#7B5BD6","#5E5B54"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { agentColor: this.props.agentColor ?? '#C96442' };
}
}
</script>
</body>
</html>
