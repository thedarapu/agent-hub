<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1E1B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #CFCAC0; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
<a href="Session.dc.html" aria-label="Close session menu" style="flex: 1"></a>

<section aria-label="Session" style="background: #F7F5F0; border-radius: 28px 28px 0 0; padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D6D1C6"></span>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="name" style="padding: 0 4px; font-size: 13px; font-weight: 600; color: #6B6860">Session name</label>
<div style="display: flex; align-items: center; gap: 8px; height: 52px; box-sizing: border-box; padding: 0 6px 0 16px; border: 1.5px solid #1F1E1B; border-radius: 16px; background: #FFFFFF">
<input id="name" value="Pull-to-refresh" style="flex: 1; min-width: 0; height: 40px; border: 0; padding: 0; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 17px">
<button style="height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #1F1E1B; color: #F7F5F0; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">Save</button>
</div>
<p style="margin: 0; padding: 0 4px; font-size: 13px; color: #6B6860">Named from your first message. Rename anytime.</p>
</div>

<div style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DED4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #EFEBE3">
<span style="font-size: 15px; color: #6B6860">Folder</span>
<span style="margin-left: auto; font-size: 15px">~/workspace/binge</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px">
<span style="font-size: 15px; color: #6B6860">Agent</span>
<span style="margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 15px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C96442"></span>Claude Code · Opus</span>
</div>
</div>

<div style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DED4">
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 0; border-bottom: 1px solid #EFEBE3; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 16px; text-align: left">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v4M8 21h8"></path><rect x="7" y="3" width="10" height="10" rx="2"></rect></svg>Pin to top</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 0; border-bottom: 1px solid #EFEBE3; background: transparent; color: #1F1E1B; font-family: Inter, sans-serif; font-size: 16px; text-align: left">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>Stop agent</button>
<button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 0; background: transparent; color: #B3261E; font-family: Inter, sans-serif; font-size: 16px; text-align: left">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Delete session</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
