<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1E1B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #CFCAC0; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
<a href="Main.dc.html" aria-label="Close picker" style="flex: 1"></a>

<section aria-label="Choose agent" style="background: #F7F5F0; border-radius: 28px 28px 0 0; padding: 12px 16px 34px; display: flex; flex-direction: column; gap: 6px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D6D1C6; margin-bottom: 10px"></span>

<div role="radiogroup" aria-label="Agent" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
<button role="radio" aria-checked="{{a.checked}}" onClick="{{a.pick}}" style="{{a.row}}">
<span style="{{a.dot}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">{{a.label}}</span>
<span style="font-size: 13px; color: #6B6860">{{a.sub}}</span>
</span>
<sc-if value="{{a.on}}" hint-placeholder-val="{{ false }}">
<svg style="margin-left: auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1E1B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
</sc-if>
</button>
</sc-for>
</div>

<div style="margin-top: 8px; padding: 14px; border-radius: 18px; background: #EFEBE3; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{pills}}" as="p" hint-placeholder-count="2">
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3DED4; display: flex; align-items: center; font-size: 14px">{{p}}</span>
</sc-for>
</div>
<label for="flags" style="font-size: 13px; color: #6B6860">Extra flags, passed through as-is</label>
<input id="flags" value="{{flags}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #E3DED4; border-radius: 12px; background: #FFFFFF; color: #1F1E1B; font-family: 'JetBrains Mono', monospace; font-size: 13px">
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { agent: 'claude' };
  }
  renderVals() {
    const agents = [
      { id: 'claude', label: 'Claude Code', sub: 'Chat view · approvals', color: '#C96442', pills: ['Opus', 'Plan mode'], flags: '' },
      { id: 'codex', label: 'Codex', sub: 'Terminal view', color: '#2F6FDB', pills: ['Default model', 'Full auto'], flags: '' },
      { id: 'amp', label: 'Amp', sub: 'Terminal view', color: '#7B5BD6', pills: ['Smart mode'], flags: '' },
      { id: 'shell', label: 'Shell', sub: 'zsh in project folder', color: '#5E5B54', pills: ['zsh'], flags: '' },
      { id: 'ssh', label: 'SSH', sub: 'homeserver', color: '#5E5B54', pills: ['homeserver'], flags: '' }
    ];
    const cur = agents.find((a) => a.id === this.state.agent);
    return {
      agents: agents.map((a) => {
        const on = a.id === this.state.agent;
        return {
          ...a,
          on,
          checked: on ? 'true' : 'false',
          dot: 'width:10px;height:10px;border-radius:5px;flex:none;background:' + a.color + ';',
          row: 'display:flex;align-items:center;gap:14px;min-height:58px;padding:0 12px;border:0;border-radius:16px;font-family:Inter,sans-serif;text-align:left;color:#1F1E1B;' + (on ? 'background:#EFEBE3;' : 'background:transparent;'),
          pick: () => this.setState({ agent: a.id })
        };
      }),
      pills: cur.pills,
      flags: cur.flags
    };
  }
}
</script>
</body>
</html>
