<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outputs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1E1B}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; color: #1F1E1B; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 56px 10px 0; display: flex; align-items: center">
<a href="Session.dc.html" aria-label="Back to session" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
</header>

<div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 400; letter-spacing: -0.3px">Outputs</h1>
<p style="margin: 0; font-size: 15px; color: #6B6860">binge</p>
</div>
<div role="tablist" aria-label="Scope" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 14px; background: #EAE6DD">
<button role="tab" aria-selected="{{sessionSel}}" onClick="{{pickSession}}" style="{{sessionTab}}">This session</button>
<button role="tab" aria-selected="{{projectSel}}" onClick="{{pickProject}}" style="{{projectTab}}">All of binge</button>
</div>
</div>

<main style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 26px; overflow: hidden">

<a href="Viewer.dc.html" style="text-decoration: none; display: flex; flex-direction: column; gap: 12px">
<div role="img" aria-label="home-redesign.html latest version (placeholder)" style="height: 210px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3DED4; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<span style="height: 100px; border-radius: 12px; background: #D9C9B8"></span>
<span style="height: 8px; width: 46%; border-radius: 4px; background: #E3DED4"></span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px"><span style="height: 52px; border-radius: 7px; background: #EFEBE3"></span><span style="height: 52px; border-radius: 7px; background: #EFEBE3"></span><span style="height: 52px; border-radius: 7px; background: #EFEBE3"></span><span style="height: 52px; border-radius: 7px; background: #EFEBE3"></span></div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Home redesign</span>
<span style="font-size: 13px; color: #6B6860">{{homeMeta}}</span>
</span>
<span style="margin-left: auto; display: flex; gap: 4px">
<sc-for list="{{homeVersions}}" as="v" hint-placeholder-count="3">
<span style="{{v.style}}">{{v.label}}</span>
</sc-for>
</span>
</div>
</a>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<a href="Viewer.dc.html" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px">
<div role="img" aria-label="Simulator screenshot (placeholder)" style="height: 170px; border-radius: 18px; background: #EFEBE3; display: flex; align-items: center; justify-content: center">
<span style="width: 70px; height: 140px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3DED4"></span>
</div>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">Simulator</span>
<span style="font-size: 13px; color: #6B6860">{{simMeta}}</span>
</span>
</a>
<sc-if value="{{isProject}}" hint-placeholder-val="{{ true }}">
<a href="Viewer.dc.html" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px">
<div role="img" aria-label="poster-row.png (placeholder)" style="height: 170px; border-radius: 18px; background: #F1E3D6; display: flex; align-items: center; justify-content: center; gap: 6px">
<span style="width: 34px; height: 52px; border-radius: 6px; background: #DCC3AE"></span>
<span style="width: 34px; height: 52px; border-radius: 6px; background: #DCC3AE"></span>
<span style="width: 34px; height: 52px; border-radius: 6px; background: #DCC3AE"></span>
</div>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">poster-row.png</span>
<span style="font-size: 13px; color: #6B6860">2 versions · Nov 5</span>
</span>
</a>
</sc-if>
<sc-if value="{{isSession}}" hint-placeholder-val="{{ false }}">
<a href="Viewer.dc.html" style="text-decoration: none; display: flex; flex-direction: column; gap: 10px">
<div style="height: 170px; border-radius: 18px; background: #1F1E1B; padding: 14px; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.7; color: #D8D4CB; display: flex; flex-direction: column; overflow: hidden">
<span style="color: #A8D5A2">+ .refreshable {</span>
<span style="color: #A8D5A2">+   await sync.reload()</span>
<span style="color: #A8D5A2">+ }</span>
<span style="color: #F2A08B">− ProgressView()</span>
</div>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">2 files changed</span>
<span style="font-size: 13px; color: #6B6860">+24 −5</span>
</span>
</a>
</sc-if>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { scope: 'project' };
  }
  renderVals() {
    const isProject = this.state.scope === 'project';
    const tab = (on) => 'height:36px;border:0;border-radius:11px;font-family:Inter,sans-serif;font-size:14px;font-weight:500;' + (on ? 'background:#FFFFFF;color:#1F1E1B;' : 'background:transparent;color:#6B6860;');
    const chip = (label, on) => ({ label, style: 'height:28px;min-width:32px;padding:0 8px;box-sizing:border-box;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;' + (on ? 'background:#1F1E1B;color:#F7F5F0;' : 'background:#EAE6DD;color:#6B6860;') });
    return {
      isProject,
      isSession: !isProject,
      sessionSel: isProject ? 'false' : 'true',
      projectSel: isProject ? 'true' : 'false',
      sessionTab: tab(!isProject),
      projectTab: tab(isProject),
      pickSession: () => this.setState({ scope: 'session' }),
      pickProject: () => this.setState({ scope: 'project' }),
      homeMeta: isProject ? '3 versions across 3 sessions' : 'v3 · made in this session',
      homeVersions: isProject ? [chip('v1', false), chip('v2', false), chip('v3', true)] : [chip('v3', true)],
      simMeta: isProject ? 'Latest build · 4m' : 'After build · 4m'
    };
  }
}
</script>
</body>
</html>
